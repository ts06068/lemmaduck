name: Release LemmaDuck distro
on:
  release:
    types: [published]
permissions:
  contents: write
  packages: write
concurrency:
  group: package-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve and validate distro identity
        id: identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/build_release.py --tag "$RELEASE_TAG" --describe --github-output "$GITHUB_OUTPUT"
      - name: Check Base
        if: steps.identity.outputs.distro == 'base'
        run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
      - name: Check Emacs
        if: steps.identity.outputs.distro == 'emacs'
        working-directory: distros/emacs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends emacs-nox
          python3 -m unittest discover -s tests -p 'test_*.py'
          emacs -Q --batch -L lisp -l tests/test-editor.el -f ert-run-tests-batch-and-exit
      - name: Check Neovim
        if: steps.identity.outputs.distro == 'neovim'
        working-directory: distros/neovim
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends neovim
          python3 -m unittest discover -s tests -p 'test_*.py'
          nvim --headless -u ./init.lua -c "luafile tests/editor.lua"
      - name: Build distro-labelled assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/build_release.py --tag "$RELEASE_TAG" --npm
      - name: Attach this distro's assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISTRO: ${{ steps.identity.outputs.distro }}
        run: |
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" build/release/"$DISTRO"/*
      - name: Match existing distro release titles to their tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | select(.name != .tag_name) | .tag_name' |
          while IFS= read -r tag; do
            case "$tag" in
              base-v*|emacs-v*|neovim-v*) gh release edit "$tag" --title "$tag" ;;
            esac
          done
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          DISTRO: ${{ steps.identity.outputs.distro }}
          VERSION: ${{ steps.identity.outputs.version }}
          PACKAGE_TAG: ${{ steps.identity.outputs.package_tag }}
        run: python3 scripts/publish_package.py "build/release/$DISTRO/lemmaduck-$DISTRO-$VERSION.npm.tgz" --tag "$PACKAGE_TAG"
