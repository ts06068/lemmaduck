name: Publish GitHub package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tested distro release tag (base-vVERSION)'
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run check && npm run build
      - name: Build the scoped package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/build_release.py --tag "$RELEASE_TAG" --npm
      - name: Publish base distro to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish build/release/*.npm.tgz --registry=https://npm.pkg.github.com --tag latest --ignore-scripts
