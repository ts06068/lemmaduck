name: Publish GitHub package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tested tag: base-vVERSION, emacs-vVERSION or neovim-vVERSION'
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve and validate distro identity
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/build_release.py --tag "$RELEASE_TAG" --describe --github-output "$GITHUB_OUTPUT"
      - name: Check Base
        if: steps.identity.outputs.distro == 'base'
        run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
      - name: Check Emacs
        if: steps.identity.outputs.distro == 'emacs'
        working-directory: distros/emacs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends emacs-nox
          python3 -m unittest discover -s tests -p 'test_*.py'
          emacs -Q --batch -L lisp -l tests/test-editor.el -f ert-run-tests-batch-and-exit
      - name: Check Neovim
        if: steps.identity.outputs.distro == 'neovim'
        working-directory: distros/neovim
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends neovim
          python3 -m unittest discover -s tests -p 'test_*.py'
          nvim --headless -u ./init.lua -c "luafile tests/editor.lua"
      - name: Build distro-labelled assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/build_release.py --tag "$RELEASE_TAG" --npm
      - name: Publish the selected distro to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          DISTRO: ${{ steps.identity.outputs.distro }}
          VERSION: ${{ steps.identity.outputs.version }}
          PACKAGE_TAG: ${{ steps.identity.outputs.package_tag }}
        run: npm publish "build/release/$DISTRO/lemmaduck-$DISTRO-$VERSION.npm.tgz" --registry=https://npm.pkg.github.com --tag "$PACKAGE_TAG" --ignore-scripts
