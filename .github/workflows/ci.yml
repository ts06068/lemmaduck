name: Check LemmaDuck
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Install the pinned Jujutsu test binary
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from vcs import install_jj
          spec = next(tool for tool in json.loads(Path("locks/tools.json").read_text())["tools"] if tool.get("name") == "jj")
          binary = Path(os.environ["RUNNER_TEMP"]) / "lemmaduck-vcs" / "jj"
          install_jj(binary, spec)
          with open(os.environ["GITHUB_PATH"], "a") as target:
              target.write(str(binary.parent) + "\n")
          PY
      - name: Test with loopback-only networking
        run: >-
          sudo unshare --net -- bash -euc
          'ip link set lo up; exec runuser -u "$1" -- env "PATH=$2" npm test'
          -- "$(id -un)" "$PATH"
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build npm install candidates
        run: |
          for distro in base emacs neovim; do
            python3 scripts/build_release.py --distro "$distro" --npm
          done
      - name: Fetch previous versions for the upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous-packages"
          gh release download base-v0.5.1 --pattern '*.npm.tgz' --dir "$RUNNER_TEMP/previous-packages"
          gh release download emacs-v0.1.0-alpha.2 --pattern '*.npm.tgz' --dir "$RUNNER_TEMP/previous-packages"
          gh release download neovim-v0.1.0-alpha.2 --pattern '*.npm.tgz' --dir "$RUNNER_TEMP/previous-packages"
      - name: Test actual global npm installation and upgrade
        run: python3 scripts/test_npm_install.py --previous "$RUNNER_TEMP/previous-packages"
      - run: ./duck setup --full --dry-run
      - name: Install the pinned OMP test binary
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from coding import install_omp
          spec = next(tool for tool in json.loads(Path("locks/tools.json").read_text())["tools"] if tool.get("name") == "omp")
          install_omp(Path(os.environ["RUNNER_TEMP"]) / "lemmaduck-omp", spec)
          PY
      - name: Check real OMP protocols without external networking
        run: >-
          sudo unshare --net -- bash -euc
          'ip link set lo up; exec runuser -u "$1" -- env "PATH=$2" python3 tests/omp_smoke.py "$3"'
          -- "$(id -un)" "$PATH" "$RUNNER_TEMP/lemmaduck-omp"

  editors:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [emacs, neovim]
    defaults:
      run:
        working-directory: distros/${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Emacs
        if: matrix.distro == 'emacs'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends emacs-nox
      - name: Install Neovim
        if: matrix.distro == 'neovim'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends neovim
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check Emacs integration
        if: matrix.distro == 'emacs'
        run: emacs -Q --batch -L lisp -l tests/test-editor.el -f ert-run-tests-batch-and-exit
      - name: Check Neovim integration
        if: matrix.distro == 'neovim'
        run: nvim --headless -u ./init.lua -c "luafile tests/editor.lua"
